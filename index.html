<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE9A8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cubes Magiques">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='20' fill='%23FF5A4E' stroke='%232B2459' stroke-width='8'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}img{max-width:100%}</style>
<title>Les Jeux d'Alba et Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: une boîte à jouets sur un seul écran — barre du hibou + étoiles en haut,
   et en dessous de gros cubes en bois colorés à toucher, posés sur un tapis de jeu jaune à pois.
   Thème volontairement unique (clair et vif) : c'est un jouet, il garde ses couleurs. */
:root{
  --mat:#FFE9A8;        /* tapis de jeu */
  --mat-dot:#FFDB78;
  --ink:#2B2459;        /* contours des cubes */
  --ink-soft:#6E68A0;
  --paper:#FFFDF6;
  --tomato:#FF5A4E;
  --tangerine:#FF961C;
  --sun:#FFC93C;
  --leaf:#36B957;
  --lagoon:#17A9C2;
  --grape:#8C5BEF;
  --bubble:#FF6AAE;
  --shade:rgba(0,0,0,.14);
  --shine:rgba(255,255,255,.38);
  --veil:rgba(43,36,89,.6);
  /* Mia : nuit bleu canard + or */
  --m-night:#0F2438;--m-panel:#173A55;--m-panel2:#1F4A6B;--m-shadow:#071522;
  --m-gold:#FFC94A;--m-gold-d:#D9921A;--m-gold-l:#FFE9A6;--m-cream:#FFF6E0;
  --m-coral:#FF7A6B;--m-mint:#3DD6A3;--m-sky:#5CB8FF;--m-lilac:#B996FF;
  --m-line:rgba(255,246,224,.16);--m-glow:rgba(255,201,74,.22);--m-star:rgba(255,246,224,.10);
  --f-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-letter:"Andika","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-display);
  background:radial-gradient(circle at 14px 14px,var(--mat-dot) 3.5px,transparent 4.5px) 0 0/30px 30px,var(--mat);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,.block:focus-visible{outline:5px dashed var(--ink);outline-offset:5px}

#app{
  height:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 4px;
}

/* ---------- barre du haut ---------- */
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.round{
  width:64px;height:64px;border-radius:50%;flex:none;cursor:pointer;
  background:var(--paper);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);
  font-size:1.9rem;line-height:1;display:grid;place-items:center;padding:0;
  transition:transform .08s,box-shadow .08s;
}
.round:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.invisible{visibility:hidden}
.talk{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.owl{font-size:clamp(2.4rem,6vw,3.4rem);line-height:1;animation:bob 3.2s ease-in-out infinite;flex:none}
.bubble{
  position:relative;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:20px;
  padding:8px 16px;font-weight:800;font-size:clamp(1rem,2.5vw,1.45rem);line-height:1.2;text-wrap:balance;
}
.bubble::before{content:"";position:absolute;left:-13px;top:50%;margin-top:-9px;border:9px solid transparent;border-right:12px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:8px solid var(--paper);border-left:0}
.stars{
  display:flex;align-items:center;gap:4px;background:var(--paper);border:4px solid var(--ink);border-radius:999px;
  padding:4px 14px 4px 8px;box-shadow:0 6px 0 var(--ink);font-weight:800;font-size:1.6rem;line-height:1.3;
  font-variant-numeric:tabular-nums;
}
.stars .s{font-size:1.7rem}
.stars.bump{animation:pop .4s}

/* ---------- scène ---------- */
#stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 6px 16px;-webkit-overflow-scrolling:touch}

/* ---------- cube (le bouton de base) ---------- */
.block{
  --c:var(--tomato);
  background:var(--c);color:#fff;border:4px solid var(--ink);border-radius:24px;cursor:pointer;padding:0;
  box-shadow:0 8px 0 var(--ink),inset 0 -9px 0 var(--shade),inset 0 7px 0 var(--shine);
  font-family:var(--f-letter);font-weight:700;line-height:1;display:grid;place-items:center;
  text-shadow:0 3px 0 var(--shade);transition:transform .08s,box-shadow .08s,filter .2s,opacity .2s;
}
.block:active,.block.sel{transform:translateY(6px);box-shadow:0 2px 0 var(--ink),inset 0 -6px 0 var(--shade),inset 0 5px 0 var(--shine)}
.block small{font-size:.62em;margin-left:.06em;opacity:.92}
.dim{opacity:.35;filter:grayscale(.6);pointer-events:none}
.right{--c:var(--leaf);animation:tada .8s}
.hint{animation:glow 1s ease-in-out infinite}
.shake{animation:shake .5s}

/* ---------- accueil ---------- */
.home{min-height:100%;display:flex;flex-direction:column;gap:clamp(14px,2.6vh,24px)}
.logo{display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:8px}
.logo .block{width:clamp(44px,8vmin,62px);aspect-ratio:1;font-size:clamp(1.6rem,4.6vmin,2.3rem);border-radius:14px;box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 var(--shade),inset 0 4px 0 var(--shine)}
.logo .block:nth-child(odd){transform:rotate(-5deg)}
.logo .block:nth-child(even){transform:rotate(4deg) translateY(-4px)}
.logo-sub{font-weight:800;font-size:clamp(1.8rem,5.4vmin,2.8rem);line-height:1;margin-left:8px;color:var(--grape);text-shadow:0 3px 0 var(--paper)}
.games{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(132px,1fr);gap:clamp(16px,2.6vw,26px)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:30px}
.tile-art{font-family:var(--f-letter);font-weight:700;font-size:clamp(2.6rem,7.5vmin,4.6rem);line-height:1;letter-spacing:.02em}
.tile-art.emo{font-size:clamp(2.6rem,8vmin,4.8rem);text-shadow:none}
.tile-art.emo.trio{font-size:clamp(1.8rem,5.6vmin,3.3rem)}
.tile-name{font-family:var(--f-display);font-weight:800;font-size:clamp(.95rem,2.1vw,1.3rem);color:var(--ink);background:var(--paper);border-radius:999px;padding:2px 14px;text-shadow:none}
.home-foot{display:flex;align-items:center;justify-content:space-between;gap:16px}
.chest{--c:var(--sun);color:var(--ink);text-shadow:none;display:flex;gap:10px;align-items:center;padding:10px 22px 10px 14px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:clamp(1.1rem,2.6vw,1.45rem)}
.chest .e{font-size:2.2rem}
.gear{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;color:var(--ink-soft);font-size:.8rem;font-weight:600;padding:4px 6px 10px;touch-action:none}
.gear .g{font-size:1.6rem;opacity:.75}
.gear::after{content:"";position:absolute;left:10%;bottom:2px;width:80%;height:5px;border-radius:3px;background:var(--ink);transform:scaleX(0);transform-origin:left}
.gear.holding::after{transform:scaleX(1);transition:transform 2s linear}

/* ---------- écrans explorer (alphabet / chiffres) ---------- */
.split{height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px}
.showcase{
  --c:var(--tomato);min-height:0;background:var(--paper);border:4px solid var(--ink);border-radius:30px;
  box-shadow:0 8px 0 var(--ink),inset 0 -12px 0 var(--c);padding:16px 16px 26px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;
}
.showcase.pop>*{animation:pop .45s}
.big-letter{font-family:var(--f-letter);font-weight:700;font-size:clamp(5rem,21vmin,12.5rem);line-height:.95;color:var(--c);text-shadow:0 6px 0 var(--mat)}
.big-letter .low{font-size:.62em;margin-left:.12em}
.pic{font-size:clamp(3.2rem,12vmin,7rem);line-height:1.1}
.word{font-family:var(--f-letter);font-weight:700;font-size:clamp(1.7rem,5.4vmin,3.1rem);letter-spacing:.05em;line-height:1.1;text-align:center}
.word b{color:var(--c)}
.letter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:14px;align-content:start;overflow-y:auto;min-height:0;padding:4px 4px 16px}
.letter-grid .block{aspect-ratio:1;font-size:clamp(2.1rem,5.2vmin,2.9rem);border-radius:18px}
.big-num{font-family:var(--f-letter);font-weight:700;font-size:clamp(5.5rem,22vmin,12rem);line-height:.95;color:var(--c);text-shadow:0 6px 0 var(--mat)}
.num-word{font-weight:800;font-size:clamp(1.6rem,5vmin,2.6rem);line-height:1}
.objs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;font-size:clamp(1.9rem,6vmin,3.1rem);line-height:1.15;max-width:100%}
.objs span{transition:opacity .2s}
.objs .ghost{opacity:.16;filter:grayscale(1)}
.objs .on{opacity:1;animation:pop .35s}
.num-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-content:center;padding:4px 4px 16px}
.num-grid .block{aspect-ratio:1;font-size:clamp(2.4rem,7vmin,4rem)}

/* ---------- quiz ---------- */
.quiz{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,4.5vh,44px)}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(18px,3.4vw,34px)}
.choice{width:clamp(104px,24vmin,190px);aspect-ratio:1;font-size:clamp(4rem,15vmin,8rem);border-radius:30px}
.choices.nums .choice{width:clamp(96px,20vmin,160px);font-size:clamp(3.4rem,12vmin,6.6rem)}
.listen{width:clamp(84px,15vmin,112px);height:clamp(84px,15vmin,112px);font-size:clamp(2.4rem,7vmin,3.4rem);background:var(--sun)}
.tray{
  width:100%;max-width:780px;background:var(--paper);border:4px solid var(--ink);border-radius:30px;
  box-shadow:0 8px 0 var(--ink);padding:18px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;
}
.obj{position:relative;font-size:clamp(2.7rem,9.5vmin,4.6rem);line-height:1;background:none;border:0;padding:6px;cursor:pointer;border-radius:20px}
.obj.counted{background:var(--mat);animation:pop .3s}
.badge{position:absolute;top:-8px;right:-8px;min-width:2rem;height:2rem;border-radius:999px;background:var(--grape);color:#fff;border:3px solid var(--ink);font:800 1.15rem/1.65rem var(--f-display);text-align:center;padding:0 4px}

/* ---------- syllabes ---------- */
.syl{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3.4vh,30px)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.row .block{width:clamp(58px,10.5vmin,86px);aspect-ratio:1;font-size:clamp(1.9rem,5.4vmin,2.9rem);border-radius:16px}
.row .block.sel{box-shadow:0 2px 0 var(--ink),0 0 0 6px var(--sun),inset 0 -6px 0 var(--shade)}
.mix{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(8px,2vw,22px);background:var(--paper);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:18px 16px 24px;align-self:center;max-width:100%}
.slot{width:clamp(80px,16vmin,132px);aspect-ratio:1;font-size:clamp(3rem,10vmin,5.6rem);cursor:default}
.op{font-weight:800;font-size:clamp(2rem,6vmin,3.6rem);color:var(--ink-soft);line-height:1}
.result{background:var(--sun);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);cursor:pointer;font-family:var(--f-letter);font-weight:700;font-size:clamp(3.4rem,12vmin,6.6rem);line-height:1;padding:.12em .3em .2em;letter-spacing:.02em}
.result .c{color:var(--lagoon)}
.result .v{color:var(--tomato)}
.mix.go .slot.c{animation:nudgeR .55s}
.mix.go .slot.v{animation:nudgeL .55s}
.mix.go .result{animation:pop .5s .3s both}

/* ---------- lire ---------- */
.read{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4.5vh,40px)}
.picture{width:clamp(150px,34vmin,260px);aspect-ratio:1;border-radius:50%;background:var(--paper);border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink),inset 0 -12px 0 var(--mat);font-size:clamp(5rem,20vmin,9.5rem);line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.picture.pop{animation:pop .45s}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,3vw,28px)}
.wcard{
  --c:var(--tomato);background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:24px;cursor:pointer;
  box-shadow:inset 0 -12px 0 var(--c),0 8px 0 var(--ink);font-family:var(--f-letter);font-weight:700;
  font-size:clamp(2.1rem,7.4vmin,3.7rem);line-height:1;letter-spacing:.07em;padding:.4em .6em .55em;min-width:4.2em;
  transition:transform .08s,box-shadow .08s,opacity .2s,filter .2s;
}
.wcard:active{transform:translateY(6px);box-shadow:inset 0 -12px 0 var(--c),0 2px 0 var(--ink)}
.wcard.right{background:var(--leaf);color:#fff;--c:var(--shade)}

/* ---------- memory ---------- */
.mem{min-height:100%;display:flex;align-items:center;justify-content:center}
.mem-grid{display:grid;gap:clamp(10px,2vw,18px);width:100%;max-width:min(100%,var(--mw))}
.card{position:relative;aspect-ratio:3/4;border:0;background:none;padding:0;cursor:pointer;perspective:800px}
.card .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);display:grid;place-items:center}
.card .back{background:var(--c);background-image:radial-gradient(circle at 50% 50%,var(--shine) 0 22%,transparent 23%);color:var(--paper);font:800 clamp(2rem,6vmin,3.4rem)/1 var(--f-display)}
.card .front{background:var(--paper);transform:rotateY(180deg);font-family:var(--f-letter);font-weight:700;line-height:1;font-size:clamp(2.4rem,8vmin,4.6rem);color:var(--c)}
.card .front.emo{font-size:clamp(2.6rem,9vmin,5rem)}
.card.done .front{background:var(--mat);box-shadow:0 7px 0 var(--ink),0 0 0 5px var(--leaf)}
.card.done{animation:tada .8s;cursor:default}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}}

/* ---------- autocollants ---------- */
.stickers{display:flex;flex-direction:column;gap:20px}
.meter{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;background:var(--paper);border:4px solid var(--ink);border-radius:999px;box-shadow:0 6px 0 var(--ink);padding:8px 18px;align-self:center}
.meter .slot5{font-size:clamp(1.8rem,5vmin,2.6rem);line-height:1}
.meter .slot5.off{opacity:.2;filter:grayscale(1)}
.meter .arrow{font-weight:800;font-size:1.6rem;color:var(--ink-soft)}
.meter .gift{font-size:clamp(1.8rem,5vmin,2.6rem)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:14px}
.stk{aspect-ratio:1;border-radius:22px;display:grid;place-items:center;font-size:clamp(2.5rem,7vmin,3.5rem);line-height:1}
.stk.got{background:var(--paper);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;padding:0}
.stk.got:nth-child(3n){transform:rotate(-4deg)}
.stk.got:nth-child(3n+1){transform:rotate(3deg)}
.stk.got.wiggle{animation:wiggle .6s}
.stk.locked{border:4px dashed var(--ink-soft);color:var(--ink-soft);font-weight:800;font-size:2rem;opacity:.55}

/* ---------- espace parents ---------- */
.parents{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;font-family:var(--f-letter);font-size:1.02rem;line-height:1.5}
.parents h2{font-family:var(--f-display);font-size:2rem;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.pcard{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:14px 18px}
.pcard h3{font-family:var(--f-display);font-size:1.25rem;margin:0 0 8px}
.pcard p{margin:8px 0 0;max-width:65ch}
.pcard ul{margin:6px 0 0;padding-left:1.2em}
.pcard li{margin:4px 0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.pbtn{border:3px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 16px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pbtn.danger{background:var(--tomato);color:#fff}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px}

/* ---------- fenêtre récompense ---------- */
.modal{position:fixed;inset:0;z-index:50;background:var(--veil);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal-card{width:100%;max-width:480px;background:var(--paper);border:5px solid var(--ink);border-radius:34px;box-shadow:0 10px 0 var(--ink);padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .45s}
.modal-card h2{margin:0;font-size:clamp(1.6rem,5vmin,2.2rem);line-height:1.1;text-wrap:balance}
.sticker-big{font-size:clamp(6rem,28vmin,10.5rem);line-height:1.1;animation:spinpop 1s}
.ok{--c:var(--leaf);width:96px;height:96px;border-radius:50%}
.ok svg{width:52px;height:52px}

/* ---------- écran de départ ---------- */
.splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(24px,5vh,44px);
  background:radial-gradient(circle at 14px 14px,var(--mat-dot) 3.5px,transparent 4.5px) 0 0/30px 30px,var(--mat);
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.splash .logo .block{width:clamp(60px,15vmin,110px);font-size:clamp(2.4rem,9vmin,4.4rem);border-radius:20px}
.splash .logo-sub{font-size:clamp(2.4rem,9vmin,4.4rem);flex-basis:100%;text-align:center;margin:8px 0 0}
.play{--c:var(--leaf);width:clamp(132px,30vmin,200px);aspect-ratio:1;border-radius:50%;animation:pulse 1.6s ease-in-out infinite}
.play svg{width:46%;height:46%;margin-left:9%}
.splash-owl{font-size:clamp(3rem,10vmin,5rem);line-height:1;animation:bob 3s ease-in-out infinite}

/* étoile qui vole jusqu'au compteur */
.fly{position:fixed;z-index:40;font-size:3.2rem;line-height:1;margin:-1.6rem 0 0 -1.6rem;pointer-events:none;transition:transform .85s cubic-bezier(.5,-0.4,.6,1),opacity .85s}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}

/* ---------- petits écrans ---------- */
@media (max-width:760px),(orientation:portrait) and (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:18px}
  .showcase{flex-direction:row;flex-wrap:wrap;column-gap:18px;padding:12px 14px 22px}

.ans:active{transform:translateY(3px)}

/* ---------- Pico, la mascotte ---------- */
.pico{display:block;width:100%;height:100%;overflow:visible}
.pico .p-all{transform-box:view-box;transform-origin:60px 116px;animation:picoIdle 3.2s ease-in-out infinite}
.pico .lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);animation:blink 4.6s infinite}
.pico .lid.r{animation-delay:.04s}
.pico .jaw{transform-box:fill-box;transform-origin:center top}
.talking .pico .jaw{animation:jaw .2s ease-in-out infinite alternate}
.pico .wing{transform-box:fill-box}
.pico .wing.l{transform-origin:right top}
.pico .wing.r{transform-origin:left top}
.pico.happy .p-all{animation:picoJump .65s ease-out 2}
.pico.happy .wing.l{animation:flapL .16s ease-in-out 8 alternate}
.pico.happy .wing.r{animation:flapR .16s ease-in-out 8 alternate}
.pico.sad .p-all{animation:picoSad 1.2s ease-in-out}
.pico.sad .pupils{transform:translateY(3px)}
.pico.wave .wing.r{animation:waveR .32s ease-in-out 6 alternate}
.pico .pupils{transition:transform .35s}
.pico.look-l .pupils{transform:translateX(-3.5px)}
.pico.look-r .pupils{transform:translateX(3.5px)}
.pico .acc-mia{display:none}
.pico.mia-look .acc-mia{display:inline}
.pico.mia-look .acc-alba{display:none}
.owl{font-size:0;width:clamp(56px,9vw,78px);height:clamp(58px,9.3vw,81px);animation:none}
@media (max-width:420px){.owl{display:block;width:46px;height:48px}}
.who .av.pico-slot{width:clamp(100px,20vmin,150px);height:clamp(104px,21vmin,156px)}
.bubble.pop-b{animation:pop .35s}
@keyframes picoIdle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes jaw{from{transform:scaleY(.3)}to{transform:scaleY(1.7)}}
@keyframes picoJump{0%{transform:translateY(0)}35%{transform:translateY(-20px) rotate(-6deg) scale(1.05)}65%{transform:translateY(0) scale(1.08,.92)}100%{transform:translateY(0)}}
@keyframes picoSad{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg) translateY(4px)}70%{transform:rotate(7deg) translateY(4px)}}
@keyframes flapL{from{transform:rotate(0)}to{transform:rotate(32deg)}}
@keyframes flapR{from{transform:rotate(0)}to{transform:rotate(-32deg)}}
@keyframes waveR{from{transform:rotate(0)}to{transform:rotate(-60deg)}}

/* ---------- premier son / rimes ---------- */
.target{display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- Mia : animations ---------- */

/* ================= mémoire (ce navigateur seulement) ================= */

const state={

function fromBag(key,list){

  if(!b||!b.length){b=bags[key]=shuffle(list);if(b.length>1&&b[b.length-1]===lastPick[key]){b.unshift(b.pop())}}
  const x=b.pop();lastPick[key]=x;return x;
}

/* ================= utilitaires ================= */

const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}

/* ================= voix ================= */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voice=null,speakId=0;
let profile='alba';
function frVoices(){return synth?synth.getVoices().filter(v=>/^fr/i.test(v.lang)):[]}
function pickVoice(){
  if(!synth)return;const vs=frVoices();if(!vs.length)return;
  const want=state.settings.voiceName,w=want&&vs.find(v=>v.name===want);if(w){voice=w;return}
  const pref=['Eloise','Denise','Vivienne','Amélie','Amelie','Audrey','Aurélie','Marie','Google français','Hortense','Julie','Céline','Léa','Thomas'];
  const frFR=vs.filter(v=>/fr[-_]FR/i.test(v.lang)),pool=frFR.length?frFR:vs;
  for(const p of pref){const f=pool.find(v=>v.name.includes(p));if(f){voice=f;return}}
  voice=pool.find(v=>v.localService)||pool[0];
}
if(synth){pickVoice();try{synth.addEventListener('voiceschanged',pickVoice)}catch(e){synth.onvoiceschanged=pickVoice}}
function voiceParams(){
  const st=state.settings,kid=st.kidVoice!==false,natural=voice&&/Eloise/i.test(voice.name);
  return{pitch:kid?(natural?1.08:(profile==='mia'?1.25:1.42)):1.02,rate:profile==='mia'?0.96:(+st.rate||0.9)};
}
function say(text,onend){
  const id=++speakId;let done=false;const vp=voiceParams();
  const fin=()=>{if(done)return;done=true;if(id===speakId){setTalk(false);if(onend)onend()}};
  setTimeout(fin,1400+text.length*95/vp.rate);

}
function tone(f,d,type,vol,delay){
  if(!state.settings.sfx)return;const a=audio();if(!a)return;
  try{
    const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}

/* ================= musique de fond (générée, sans fichier) ================= */
const Music=(()=>{
  const KEYM='jeux-musique';let on=true;try{on=localStorage.getItem(KEYM)!=='0'}catch(e){}
  let master=null,timer=null,theme=null,step=0,nextT=0,ducked=false;
  const mf=m=>440*Math.pow(2,(m-69)/12);
  const TH={
    alba:{bpm:112,vol:.5,chords:[[48,60,64,67],[45,57,60,64],[41,57,60,65],[43,55,59,62]],
      mel:[72,0,76,79,76,0,74,72, 69,0,72,76,74,0,72,0, 77,0,76,74,72,0,69,72, 71,0,74,0,79,77,76,74]},
    mia:{bpm:92,vol:.42,chords:[[45,57,60,64],[41,57,60,65],[48,55,60,64],[43,55,59,62]],arp:[1,2,3,2,1,3,2,3]}
  };
  function pl(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
  function play(s,t){
    const th=TH[theme],bar=Math.floor(s/8)%4,i=s%8,ch=th.chords[bar],e=60/th.bpm/2;
    if(i===0||i===4)pl(mf(ch[0]+(i===4?7:0)),t,e*3.5,'sine',.32);
    if(i===0)ch.slice(1).forEach(n=>pl(mf(n),t,e*7.5,'sine',.05));
    if(theme==='alba'){const m=th.mel[s%32];if(m)pl(mf(m),t,e*1.6,'triangle',.15);if(i%2===1)pl(mf(96),t,.03,'square',.01)}
    else{pl(mf(ch[th.arp[i]]+12),t,e*1.8,'sine',.08);if(i===0&&bar%2===0)pl(mf(ch[3]+24),t,e*6,'sine',.035)}
  }
  function level(){return (ducked?.3:1)*TH[theme].vol*.3}
  function tick(){
    if(!ac||!master)return;const e=60/TH[theme].bpm/2;
    if(nextT<ac.currentTime-.05)nextT=ac.currentTime+.05;
    while(nextT<ac.currentTime+.3){try{play(step,nextT)}catch(x){}nextT+=e;step++}
  }
  function stopNow(){
    clearInterval(timer);timer=null;
    if(master){const m=master;try{m.gain.setTargetAtTime(.0001,ac.currentTime,.25)}catch(e){}setTimeout(()=>{try{m.disconnect()}catch(e){}},1500)}
    master=null;
  }
  function start(n){
    theme=n;if(!on)return;const a=audio();if(!a)return;
    if(timer)stopNow();
    master=a.createGain();master.gain.setValueAtTime(.0001,a.currentTime);master.gain.exponentialRampToValueAtTime(level(),a.currentTime+1.5);master.connect(a.destination);
    step=0;nextT=a.currentTime+.15;timer=setInterval(tick,80);tick();
  }
  return{
    start,stop:stopNow,isOn:()=>on,
    duck(b){ducked=b;if(master&&ac&&theme)try{master.gain.setTargetAtTime(level(),ac.currentTime,.12)}catch(e){}},
    setOn(b){on=b;try{localStorage.setItem(KEYM,b?'1':'0')}catch(e){}if(b&&theme)start(theme);else stopNow()}
  };
})();

/* ================= animations d'entrée ================= */
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)');
function staggerIn(els,mode){
  if(REDUCE.matches||!els)return;const many=els.length>14;
  els.forEach((el,i)=>{try{
    el.animate(mode==='side'
      ?[{opacity:0,transform:`translateX(${i%2?46:-46}px)`},{opacity:1,transform:'none'}]
      :[{opacity:0,transform:'scale(.45) translateY(26px)'},{opacity:1,transform:'scale(1.07)',offset:.7},{opacity:1,transform:'none'}],
      {duration:mode==='side'?420:520,delay:i*(many?20:65),easing:'cubic-bezier(.2,.8,.3,1)',fill:'backwards'});
  }catch(e){}});
}
function animateScreen(){
  const first=stage.firstElementChild;
  if(first&&!REDUCE.matches)try{first.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:320,easing:'ease-out'})}catch(e){}
  staggerIn($$('.tile,.letter-grid .block,.num-grid .block,.choice,.wcard,.card,.rcard,.ptray,.grp,.row .block,.stk.got,.obj,.picture,.showcase,.mix',stage));
}
function buildDecor(){
  const d=document.createElement('div');d.className='decor';d.setAttribute('aria-hidden','true');
  const G='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789★♥';let h='';
  for(let i=0;i<16;i++)h+=`<span style="--x:${rnd(0,94)}%;--s:${(1.6+Math.random()*2.4).toFixed(1)}rem;--c:${col(i)};--d:${rnd(16,30)}s;--dl:-${rnd(0,30)}s;--r:${rnd(-200,200)}deg">${pick([...G])}</span>`;
  d.innerHTML=h;document.body.insertBefore(d,$('#app'));
}


/* ================= confettis ================= */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
const CONF=['#FF5A4E','#FF961C','#FFC93C','#36B957','#17A9C2','#8C5BEF','#FF6AAE'];
function fit(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
fit();addEventListener('resize',fit);
function confetti(x,y,n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  n=n||80;
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,s:7+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:CONF[i%CONF.length],life:110+Math.random()*40,round:Math.random()<.35});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){
    p.vy+=.42;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.round){cx.beginPath();cx.arc(0,0,p.s/2,0,7);cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}

/* ================= étoiles & autocollants ================= */
function paintStars(){$('#starNum').textContent=state.stars}
function addStar(fromEl){
  state.stars++;save();
  if(state.stars%5===0&&state.stars/5<=STICKERS.length)pendingSticker=true;
  const r=fromEl.getBoundingClientRect(),t=$('#stars').getBoundingClientRect();
  const s=document.createElement('div');s.className='fly';s.textContent='⭐';
  const x0=r.left+r.width/2,y0=r.top+r.height/2;
  s.style.left=x0+'px';s.style.top=y0+'px';document.body.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    s.style.transform=`translate(${t.left+22-x0}px,${t.top+t.height/2-y0}px) scale(.45)`;s.style.opacity='.5';
  }));
  setTimeout(()=>{s.remove();paintStars();restart($('#stars'),'bump');tone(1320,.12,'sine',.08)},880);
}
function closeModal(){$$('.modal').forEach(m=>m.remove())}
const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function showSticker(cb){
  pendingSticker=false;
  const idx=Math.floor(state.stars/5)-1,em=STICKERS[idx];
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="modal-card" role="dialog" aria-label="Nouvel autocollant"><h2>Nouvel autocollant !</h2><div class="sticker-big">${em}</div><button class="block ok" aria-label="Super, continuer">${CHECK}</button></div>`;
  document.body.appendChild(m);
  sfx.fanfare();confetti(innerWidth/2,innerHeight/2,140);
  say('Youpi ! Un nouvel autocollant pour ta collection !');
  $('.ok',m).onclick=()=>{sfx.pop();m.remove();cb&&cb()};
}

/* ================= réussite / erreur ================= */
function win(el,text,next){
  const tk=state.token;
  sfx.win();
  const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2);
  el.classList.remove('hint','shake');el.classList.add('right');
  $$('.choice,.wcard,.rcard,.ptray',stage).forEach(b=>{if(b!==el)b.classList.add('dim')});
  addStar(el);picoMood('happy');
  say(pick(PRAISE)+' '+text,()=>setTimeout(()=>{
    if(tk!==state.token)return;
    if(pendingSticker)showSticker(()=>{if(tk===state.token)next()});
    else next();
  },550));
}
function lose(el,text,after){sfx.oops();restart(el,'shake');picoMood('sad');say(text,after)}

SCREENS.find=function(first){
  const n=LV.find>=6?5:4;
  const target=pickFresh(ALPHA,'find');
  const opts=shuffle([target,...shuffle(ALPHA.filter(a=>a!==target)).slice(0,n-1)]);
  const m=roundCase(),cs=shuffle(COLS.map((_,i)=>i));
  stage.innerHTML=`<div class="quiz">
    <button class="round listen" id="rep" aria-label="Écouter la question">🔊</button>
    <div class="choices">${opts.map((o,i)=>`<button class="block choice" style="--c:${col(cs[i])}" data-i="${i}">${caseIt(o[0],m)}</button>`).join('')}</div>
  </div>`;
  const q=`Où est la lettre ${target[1]} ?`;
  setPrompt('Où est la lettre ? Écoute bien !',(first?'Trouve la lettre ! ':'')+q);
  $('#rep').onclick=()=>{sfx.boing();say(q)};
  let wrong=0,done=false;
  $$('.choice',stage).forEach(b=>b.onclick=()=>{
    if(done)return;const o=opts[+b.dataset.i];
    if(o===target){done=true;win(b,`C'est la lettre ${target[1]} !`,()=>{LV.find++;SCREENS.find()})}

      if(wrong>=2)$(`[data-i="${opts.indexOf(target)}"]`,stage).classList.add('hint');
    }

/* ---------- compter ---------- */
SCREENS.count=function(first){
  const max=Math.min(20,8+Math.floor(LV.count/2));
  let n;do{n=rnd(1,max)}while(n===lastPick.countN&&max>1);lastPick.countN=n;
  const o=pickFresh(OBJ,'count');
  const set=new Set([n]);while(set.size<3)set.add(rnd(Math.max(1,n-3),Math.min(20,n+3)));
  const opts=shuffle([...set]);
  const qty=k=>k===1?(o[3]==='f'?'une ':'un ')+o[1]:NUM[k]+' '+o[2];
  stage.innerHTML=`<div class="quiz">
    <div class="tray">${Array.from({length:n},(_,k)=>`<button class="obj" data-k="${k}" aria-label="${o[1]}">${o[0]}</button>`).join('')}</div>
    <div class="choices nums">${opts.map((v,i)=>`<button class="block choice" style="--c:${col(i+3)}" data-v="${v}">${v}</button>`).join('')}</div>
  </div>`;
  const objs=$$('.obj',stage);let counted=0,wrong=0,done=false;
  const mark=(b,k)=>{b.classList.add('counted');b.insertAdjacentHTML('beforeend',`<span class="badge">${k}</span>`)};
  objs.forEach(b=>b.onclick=()=>{
    if(done||b.classList.contains('counted'))return;
    counted++;mark(b,counted);tone(500+counted*60,.1,'triangle',.1);say(NUM[counted]);
  });
  const reset=()=>{objs.forEach(b=>{b.classList.remove('counted');const s=$('.badge',b);if(s)s.remove()});counted=0};
  const countAlong=()=>{reset();sayList(objs.map((_,k)=>NUM[k+1]),k=>{counted=k+1;mark(objs[k],k+1)},()=>say(`Il y a ${qty(n)} !`))};
  const q=`Combien de ${o[2]} ?`;
  setPrompt(`Combien de ${o[0]} ?`,(first?'Compter ! ':'')+q+(first?' Touche-les pour compter.':''));
  $$('.choice',stage).forEach(b=>b.onclick=()=>{
    if(done)return;const v=+b.dataset.v;
    if(v===n){done=true;win(b,`Il y a ${qty(n)} !`,()=>{LV.count++;SCREENS.count()})}
    else{
      wrong++;lose(b,`Non, ça c'est ${NUM[v]}. Comptons ensemble !`,countAlong);
      if(wrong>=2)$(`.choice[data-v="${n}"]`,stage).classList.add('hint');
    }
  });
};

SCREENS.memory=function(first){
  const pairs=LV.mem>=4?8:LV.mem>=2?6:4;
  const m=roundCase();
  const pool=[
    ...shuffle(ALPHA).slice(0,6).map(a=>({k:'L'+a[0],show:caseIt(a[0],m),say:a[1],emo:false})),
    ...shuffle(Array.from({length:20},(_,k)=>k+1)).slice(0,5).map(n=>({k:'N'+n,show:String(n),say:NUM[n],emo:false})),
    ...shuffle(WORDS).slice(0,7).map(w=>({k:'W'+w[0],show:w[1],say:w[0],emo:true}))
  ];
  const chosen=shuffle(pool).slice(0,pairs);
  const deck=shuffle(chosen.flatMap((c,i)=>[{...c,col:i},{...c,col:i}]));
  const cols=4;
  stage.innerHTML=`<div class="mem"><div class="mem-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));--mw:${cols*175}px">${deck.map((c,i)=>`<button class="card" data-i="${i}" aria-label="Carte" style="--c:${col(c.col)}"><span class="in"><span class="face back">?</span><span class="face front ${c.emo?'emo':''}">${c.show}</span></span></button>`).join('')}</div></div>`;
  setPrompt('Retrouve les paires !',(first?'Memory ! ':'')+'Retourne deux cartes pareilles !');
  const cards=$$('.card',stage);let open=[],busy=false,found=0;
  cards.forEach(b=>b.onclick=()=>{
    if(busy||b.classList.contains('up')||b.classList.contains('done'))return;
    const c=deck[+b.dataset.i];
    b.classList.add('up');tone(560+open.length*120,.1,'triangle',.1);say(c.say);
    open.push(b);
    if(open.length<2)return;
    const [a1,a2]=open;open=[];busy=true;
    const same=deck[+a1.dataset.i].k===deck[+a2.dataset.i].k;
    if(same){
      setTimeout(()=>{
        a1.classList.replace('up','done');a2.classList.replace('up','done');found++;busy=false;
        if(found===pairs){LV.mem++;win(a2,'Tu as trouvé toutes les paires !',()=>SCREENS.memory())}
        else{sfx.win();picoMood('happy');const r=a2.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,40);say(pick(['Une paire !','Bravo, pareil !','Super, une paire !']))}
      },500);
    }else{
      setTimeout(()=>{sfx.oops();a1.classList.remove('up');a2.classList.remove('up');busy=false},1300);
    }
  });
};

/* ---------- le premier son ---------- */
const FIRST_SKIP=/^(an|en|in|on|un|ou|au|ch|ph|é|e|h|w|x|y|q)/i;
SCREENS.first=function(first){
  const n=LV.first>=5?4:3;
  const okL=ALPHA.filter(a=>a[2].some(w=>!FIRST_SKIP.test(w[0])));
  const letter=fromBag('firstL',okL);
  const [word,emo]=pick(letter[2].filter(w=>!FIRST_SKIP.test(w[0])));
  const opts=shuffle([letter,...shuffle(okL.filter(a=>a!==letter)).slice(0,n-1)]);
  const m=roundCase(),w=word.toLowerCase();
  stage.innerHTML=`<div class="quiz">
    <button class="picture" id="pic" aria-label="Écouter le mot">${emo}</button>
    <div class="choices">${opts.map((o,i)=>`<button class="block choice" style="--c:${col(i+1)}" data-i="${i}">${caseIt(o[0],m)}</button>`).join('')}</div>
  </div>`;
  const q=`${w} ! Par quelle lettre commence le mot ${w} ?`;
  setPrompt('Par quelle lettre ça commence ?',(first?'Le premier son ! ':'')+q);
  $('#pic').onclick=()=>{sfx.boing();restart($('#pic'),'pop');say(q)};
  let wrong=0,done=false;
  $$('.choice',stage).forEach(b=>b.onclick=()=>{
    if(done)return;const o=opts[+b.dataset.i];
    if(o===letter){done=true;win(b,`${w} commence par la lettre ${letter[1]} !`,()=>{LV.first++;SCREENS.first()})}
    else{wrong++;lose(b,`Non, ça c'est la lettre ${o[1]}. Écoute bien : ${w} !`);if(wrong>=2)$(`[data-i="${opts.indexOf(letter)}"]`,stage).classList.add('hint')}
  });
};

/* ---------- les rimes ---------- */
const RHY=[
 ['chat','🐱','a'],['rat','🐀','a'],['pizza','🍕','a'],['panda','🐼','a'],['koala','🐨','a'],['ananas','🍍','a'],
 ['gâteau','🎂','o'],['bateau','⛵','o'],['château','🏰','o'],['vélo','🚲','o'],['moto','🏍️','o'],['robot','🤖','o'],['chapeau','🎩','o'],
 ['souris','🐭','i'],['lit','🛏️','i'],['kiwi','🥝','i'],['ski','🎿','i'],['riz','🍚','i'],
 ['poisson','🐟','on'],['ballon','🎈','on'],['camion','🚚','on'],['avion','✈️','on'],['mouton','🐑','on'],['lion','🦁','on'],['citron','🍋','on'],['cochon','🐷','on'],
 ['lapin','🐰','in'],['sapin','🎄','in'],['raisin','🍇','in'],['pain','🍞','in'],['main','✋','in'],['train','🚂','in'],['dauphin','🐬','in'],['poussin','🐣','in'],
 ['loup','🐺','ou'],['chou','🥬','ou'],['hibou','🦉','ou'],['kangourou','🦘','ou'],['genou','🦵','ou'],
 ['fleur','🌸','eur'],['cœur','❤️','eur'],['tracteur','🚜','eur'],['ordinateur','💻','eur'],
 ['bébé','👶','é'],['clé','🔑','é'],['café','☕','é'],['dé','🎲','é'],['fusée','🚀','é'],['nez','👃','é']
];
SCREENS.rhyme=function(first){
  const keys=[...new Set(RHY.map(r=>r[2]))];
  const t=fromBag('rhy',RHY);
  const g=pick(RHY.filter(r=>r[2]===t[2]&&r!==t));

  stage.innerHTML=`<div class="rimes">
    <div class="target"><button class="picture" id="pic" aria-label="Écouter">${t[1]}</button><span class="w">${t[0]}</span></div>
    <div class="rcards">${opts.map((o,i)=>`<button class="rcard" style="--c:${col(i*2)}" data-i="${i}"><span class="e">${o[1]}</span><span class="w">${o[0]}</span></button>`).join('')}</div>
  </div>`;
  const q=`Qu'est-ce qui rime avec ${t[0]} ? ${opts.map(o=>o[0]).join(' ? ... ')} ?`;
  setPrompt(`Qu'est-ce qui rime avec « ${t[0]} » ?`,(first?'Les rimes ! ':'')+q);

  });
};

/* ---------- les additions ---------- */

/* ---------- plus ou moins ---------- */
SCREENS.more=function(first){
  let a,b;do{a=rnd(1,10);b=rnd(1,10)}while(Math.abs(a-b)<(LV.more>=4?1:2));

    else{wrong++;lose(t,`Non, ici il y a ${qty(cnt[s])}, et là, ${qty(cnt[1-s])}. ${q}`);if(wrong>=2)$(`.ptray[data-s="${good}"]`,stage).classList.add('hint')}

/* ---------- espace parents ---------- */
SCREENS.parents=function(){

    <section class="pcard"><h3>Progrès</h3>
      <p>${state.stars} étoile${state.stars>1?'s':''} gagnée${state.stars>1?'s':''} · ${got} autocollant${got>1?'s':''} sur ${STICKERS.length}. Un autocollant toutes les 5 étoiles. Les progrès restent dans ce navigateur, sur cet appareil.</p>

      <li><b>Additions</b> : additionner deux petits groupes d'objets (résultat jusqu'à 10).</li>

  </div>`;
  $$('.seg',stage).forEach(g=>$$('button',g).forEach(b=>b.onclick=()=>{

    else{s[k]=k==='rate'?+v:(v==='true'||v==='false')?v==='true':v;save()}
    $$('button',g).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    if(k==='sfx'&&s.sfx)sfx.pop();

<script>
/* =====================================================================
   MIA — Le Grand Quiz (7 ans)
   Questions générées à partir de modèles + banque écrite à la main.
   ===================================================================== */
(function(){
"use strict";
const K=window.KIT;
const {say,hush,sfx,tone,confetti,shuffle,pick}=K;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const root=$('#mia');
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const uniq=a=>[...new Set(a)];
const cap=s=>{s=String(s);return s.charAt(0).toUpperCase()+s.slice(1)};

function mk(cat,q,good,bads,opt){
  good=String(good);
  const b=uniq(bads.filter(x=>x!==undefined&&x!==null).map(String)).filter(x=>x!==good&&x!=='');
  if(b.length<3)return null;
  const answers=shuffle([good,...shuffle(b).slice(0,3)]);
  return Object.assign({cat,q,answers,correct:answers.indexOf(good)},opt||{});
}
const near=(n,ds,min)=>uniq(ds.map(d=>n+d)).filter(x=>x!==n&&x>=(min===undefined?0:min));

const CAT={
  maths:{n:'Maths',e:'🔢'},francais:{n:'Français',e:'📚'},animaux:{n:'Animaux',e:'🐾'},monde:{n:'Le monde',e:'🌍'},
  sciences:{n:'Sciences',e:'🔬'},temps:{n:'Le temps',e:'⏰'},culture:{n:'Contes et culture',e:'🎭'},logique:{n:'Logique',e:'🧩'},histoire:{n:'Histoire',e:'🏰'}
};
const GEN={};Object.keys(CAT).forEach(c=>GEN[c]=[]);
const add=(cat,lv,f)=>GEN[cat].push({lv,f});

/* ---------------- MATHS (7-8 ans : CE1 / CE2) ---------------- */
const NAMES=[['Léa','elle'],['Tom','il'],['Inès','elle'],['Hugo','il'],['Jade','elle'],['Nathan','il'],['Lina','elle'],['Louis','il'],['Alba','elle'],['Mia','elle'],['Gabriel','il'],['Chloé','elle'],['Adam','il'],['Rose','elle'],['Jules','il'],['Zoé','elle']];
const THINGS=['billes','bonbons','images','crayons','fleurs','perles','cartes','pommes','gâteaux','autocollants','coquillages','livres','ballons','châtaignes'];
const fmtN=n=>n.toLocaleString('fr-FR');

add('maths',[1,2,3],lv=>{const [a,b]=lv===1?[R(12,49),R(5,39)]:lv===2?[R(35,99),R(17,99)]:[R(120,499),R(45,399)];const n=a+b;
  return mk('maths',`Combien font ${a} + ${b} ?`,n,near(n,[1,-1,2,-2,10,-10,100]))});
add('maths',[1,2,3],lv=>{let a,b;if(lv===1){a=R(20,60);b=R(3,19)}else if(lv===2){a=R(50,100);b=R(12,49)}else{a=R(200,999);b=R(45,199)}const n=a-b;
  return mk('maths',`Combien font ${a} − ${b} ?`,n,near(n,[1,-1,2,-2,10,-10]),{say:`Combien font ${a} moins ${b} ?`})});
add('maths',[1,2,3],lv=>{const t=lv===1?pick([2,5,10]):lv===2?pick([3,4,5]):pick([6,7,8,9]);const k=R(2,10);const n=t*k;

 ['culture',3,"Quel écrivain a imaginé « Vingt mille lieues sous les mers » ?","Jules Verne",["Jean de La Fontaine","Molière","Antoine de Saint-Exupéry"]],
 ['culture',1,"Combien de couleurs y a-t-il sur le drapeau français ?","3",["2","4","5"]],
 ['culture',3,"Quel instrument se joue avec un archet ?","Le violon",["La flûte","Le piano","La trompette"]],
 ['culture',2,"Comment s'appelle l'hymne national de la France ?","La Marseillaise",["Frère Jacques","Au clair de la lune","Joyeux anniversaire"]],
 ['culture',3,"Quel peintre a peint « La Nuit étoilée » ?","Vincent van Gogh",["Léonard de Vinci","Claude Monet","Pablo Picasso"]],
 ['monde',2,"Combien y a-t-il d'océans sur la Terre ?","5",["2","3","10"],"Pacifique, Atlantique, Indien, Arctique et Austral."],
 ['monde',3,"Quel est le plus haut sommet du monde ?","L'Everest",["Le mont Blanc","Le Kilimandjaro","Le mont Fuji"]],
 ['monde',3,"Quel est le plus grand pays du monde ?","La Russie",["La Chine","Le Canada","La France"]],
 ['monde',2,"Sur quel continent vivent les kangourous en liberté ?","L'Océanie",["L'Europe","L'Afrique","L'Amérique"]],
 ['monde',3,"Quel fleuve traverse la forêt amazonienne ?","L'Amazone",["Le Nil","La Seine","Le Danube"]]
];
Object.keys(CAT).forEach(cat=>add(cat,[1,2,3],lv=>{const it=FIX.filter(x=>x[0]===cat&&x[1]===lv);if(!it.length)return null;const x=pick(it);return mk(cat,x[2],x[3],x[4],x[5]?{explain:x[5]}:null)}));

/* ---------------- tirage ---------------- */
const MKEY='mia-quiz-v1';
let M={};try{M=JSON.parse(localStorage.getItem(MKEY))||{}}catch(e){M={}}
M=Object.assign({best:0,total:0,games:0,read:true,seen:[]},M);
const seen=new Set(M.seen);
function msave(){try{M.seen=[...seen].slice(-6000);localStorage.setItem(MKEY,JSON.stringify(M))}catch(e){}}
let recent=[];
function sample(lv){
  const cats=Object.keys(GEN).filter(c=>GEN[c].some(g=>g.lv.includes(lv)));
  const pool=cats.filter(c=>!recent.includes(c));const cat=pick(pool.length?pool:cats);
  const q=pick(GEN[cat].filter(g=>g.lv.includes(lv))).f(lv);
  if(!q||q.answers.length!==4||new Set(q.answers).size!==4||q.correct<0)return null;
  return q;
}
const keyOf=q=>q.q+'|'+(q.big||'')+'|'+q.answers[q.correct];
function nextQ(lv){
  let best=null;
  for(let t=0;t<120;t++){const q=sample(lv);if(!q)continue;if(!best)best=q;if(!seen.has(keyOf(q))){best=q;break}}
  seen.add(keyOf(best));recent=[best.cat,...recent].slice(0,3);msave();return best;
}
window.__quiz={sample,keyOf};

/* ---------------- jeu ---------------- */
const LADDER=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000];
const SAFE=[4,9];
const fmt=n=>n.toLocaleString('fr-FR');
const reduceM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function coinRain(n){
  if(reduceM())return;
  for(let i=0;i<n;i++){const c=document.createElement('span');c.className='coin-drop';c.textContent='🪙';c.style.left=(Math.random()*96)+'vw';c.style.fontSize=(22+Math.random()*24)+'px';document.body.appendChild(c);
    const a=c.animate([{transform:'translateY(-70px) rotate(0)'},{transform:`translateY(${innerHeight+90}px) rotate(${R(-400,400)}deg)`}],{duration:1300+Math.random()*1200,delay:Math.random()*450,easing:'cubic-bezier(.45,.05,.8,1)',fill:'both'});a.onfinish=()=>c.remove()}
}
function countUp(el,to){const t0=performance.now(),d=1400;const f=t=>{const p=Math.min(1,(t-t0)/d);el.textContent=fmt(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const clean=s=>String(s).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}❓…«»]/gu,' ').replace(/___/g,' ... ').replace(/\s+/g,' ').trim();
const lvl=i=>i<5?1:i<10?2:3;
const safeWin=i=>i>=10?LADDER[9]:i>=5?LADDER[4]:0;
let G=null,tok=0;

function open(){root.hidden=false;K.Music.start('mia');menu();setTimeout(()=>K.picoMood('wave'),200);say('Bonjour Mia ! Je suis Pico, ton présentateur. Prête pour le grand quiz ?')}
function menu(){
  tok++;hush();G=null;root.scrollTop=0;
  root.innerHTML=`<div class="mm">
    <div class="mm-pico">${K.pico('mia')}</div>
    <h1>Le Grand Quiz<span>de Mia</span></h1>
    <p class="mm-sub">15 questions, 3 jokers, et un million de pièces d'or à gagner !</p>
    <button class="m-btn gold big" id="mplay">Jouer</button>
    <div class="mm-stats">
      <div class="stat"><b>${fmt(M.best)}</b><span>Record</span></div>
      <div class="stat"><b>${fmt(M.total)}</b><span>Trésor total</span></div>
      <div class="stat"><b>${M.games}</b><span>Parties</span></div>
    </div>
    <button class="m-toggle" id="mreadset" aria-pressed="${M.read}"><span class="sw" aria-hidden="true"></span>Lire les questions à voix haute</button>
    <button class="m-toggle" id="mmusic" aria-pressed="${K.Music.isOn()}"><span class="sw" aria-hidden="true"></span>Musique de fond</button>
    <div class="mm-rules">
      <p><b>Comment jouer :</b> choisis une réponse, puis appuie sur « Valider ». Chaque bonne réponse te fait monter d'une marche.</p>
      <p><b>Paliers :</b> à la question 5 et à la question 10, ton trésor est gardé pour de bon.</p>
      <p><b>Jokers :</b> 50:50 enlève deux mauvaises réponses, 🦉 le hibou te donne son avis, 🙋 la classe vote.</p>
    </div>
    <button class="m-link" id="mswap">Changer de joueuse</button>
  </div>`;
  $('#mplay').onclick=()=>{sfx.win();start()};
  $('#mreadset').onclick=e=>{M.read=!M.read;msave();e.currentTarget.setAttribute('aria-pressed',String(M.read));sfx.pop()};
  $('#mmusic').onclick=e=>{const b=!K.Music.isOn();K.Music.setOn(b);if(b)K.Music.start('mia');e.currentTarget.setAttribute('aria-pressed',String(b));sfx.pop()};
  K.staggerIn($$('.mm>*',root));
  $('#mswap').onclick=()=>{sfx.pop();hush();root.hidden=true;K.showPicker()};
}
function start(){G={i:0,used:{},gone:[],tok:++tok};M.games++;msave();ask()}
function ask(){G.q=nextQ(lvl(G.i));G.sel=-1;G.lock=false;G.gone=[];G.help='';render();if(M.read)readQ()}
function readQ(){const q=G.q;let t=clean(q.say||q.q);if(!q.noRead)t+=' ... '+q.answers.map((a,k)=>`${'ABCD'[k]} : ${clean(a)}`).join('. ');say(t+'.')}

function render(){
  const q=G.q,i=G.i,c=CAT[q.cat];root.scrollTop=0;
  root.innerHTML=`<div class="mg">
    <div class="mg-top">
      <button class="m-round" id="mx" aria-label="Arrêter la partie">✕</button>
      <div class="mg-prog">Question <b>${i+1}</b> sur 15 · pour <b>${fmt(LADDER[i])}</b> pièces</div>
      <button class="m-round" id="msay" aria-label="Lire la question">🔊</button>
    </div>
    <div class="pips" aria-hidden="true">${LADDER.map((_,k)=>`<i class="${k<i?'done':k===i?'cur':''}${SAFE.includes(k)?' safe':''}"></i>`).join('')}</div>
    <div class="mg-main">
      <section class="mg-play">
        <div class="mg-host"><span class="mg-pico">${K.pico('mia')}</span><div class="mg-cat">${c.e} ${c.n}</div></div>
        <div class="mg-q">${q.big?`<div class="mg-big">${q.big}</div>`:''}<p>${q.q}</p></div>
        <div class="mg-ans">${q.answers.map((a,k)=>`<button class="ans" data-k="${k}"><span class="L">${'ABCD'[k]}</span><span class="t">${a}</span></button>`).join('')}</div>
        <div id="mzone"></div>
      </section>
      <aside class="ladder" aria-label="Échelle des gains">${LADDER.map((v,k)=>({v,k})).reverse().map(({v,k})=>`<div class="rung${k<i?' done':''}${k===i?' cur':''}${SAFE.includes(k)?' safe':''}"><span class="n">${k+1}</span><span>${fmt(v)}</span></div>`).join('')}</aside>
    </div>
  </div>`;
  $('#msay').onclick=()=>{sfx.pop();readQ()};
  $('#mx').onclick=()=>{sfx.pop();askStop(true)};
  $$('.ans',root).forEach(b=>b.onclick=()=>{
    if(G.lock||b.classList.contains('gone'))return;
    G.sel=+b.dataset.k;$$('.ans',root).forEach(x=>x.classList.toggle('sel',x===b));
    tone(660,.08,'triangle',.1);const ok=$('#mok');if(ok)ok.disabled=false;
    if(M.read)say(clean(G.q.answers[G.sel]));
  });
  controls();
  K.staggerIn([$('.mg-q',root)]);K.staggerIn($$('.ans',root),'side');
}
function controls(){
  const z=$('#mzone',root),cur=G.i?LADDER[G.i-1]:0;
  z.innerHTML=`${G.help}
    <div class="mg-row">
      <div class="jokers">
        <button class="joker" id="j50" aria-label="Joker 50:50" ${G.used.f?'disabled':''}>50:50</button>
        <button class="joker" id="jowl" aria-label="Joker du hibou" ${G.used.o?'disabled':''}><span class="e">🦉</span></button>
        <button class="joker" id="jvote" aria-label="Joker vote de la classe" ${G.used.v?'disabled':''}><span class="e">🙋</span></button>
      </div>
      <button class="m-btn gold" id="mok" ${G.sel<0?'disabled':''}>Valider</button>
    </div>
    <div class="mstop" id="mstop">${cur?`<button class="m-link" id="mkeep">💰 Garder mon trésor : ${fmt(cur)} pièces</button>`:''}</div>`;
  $('#mok').onclick=validate;
  const k=$('#mkeep');if(k)k.onclick=()=>{sfx.pop();askStop(false)};
  $('#j50').onclick=()=>joker('f');$('#jowl').onclick=()=>joker('o');$('#jvote').onclick=()=>joker('v');
}
function askStop(quit){
  if(G.lock)return;const cur=G.i?LADDER[G.i-1]:0;const s=$('#mstop',root);
  s.innerHTML=`<div class="mconfirm"><span>${cur?`Tu t'arrêtes et tu gardes ${fmt(cur)} pièces ?`:'Tu veux arrêter la partie ?'}</span>
    <button class="m-btn gold" id="mstopY">${cur?'Oui, je garde':'Oui, arrêter'}</button><button class="m-btn" id="mstopN">Non, je continue</button></div>`;
  s.scrollIntoView({block:'nearest',behavior:'smooth'});
  if(quit||cur)say(cur?`Tu veux t'arrêter et garder ${cur} pièces d'or ?`:'Tu veux arrêter la partie ?');
  $('#mstopY').onclick=()=>finish(cur,'stop');
  $('#mstopN').onclick=()=>{sfx.pop();controls()};
}
function joker(k){
  if(G.lock||G.used[k])return;G.used[k]=1;sfx.pop();
  const q=G.q,c=q.correct,lv=lvl(G.i),alive=[0,1,2,3].filter(x=>!G.gone.includes(x));
  if(k==='f'){
    G.gone=shuffle(alive.filter(x=>x!==c)).slice(0,2);
    G.gone.forEach(x=>{const b=$(`.ans[data-k="${x}"]`,root);b.classList.add('gone');b.classList.remove('sel');b.disabled=true});
    if(G.gone.includes(G.sel))G.sel=-1;
    say('Pouf ! Deux mauvaises réponses ont disparu.');
  }else if(k==='o'){
    const sure=Math.random()<(lv===1?.95:lv===2?.85:.7);
    const ans=sure?c:pick(alive.filter(x=>x!==c));
    const txt=lv===1?`Facile ! Je suis sûr que c'est la réponse ${'ABCD'[ans]}.`:lv===2?`Je pense que c'est la réponse ${'ABCD'[ans]}.`:`Hmm… je crois que c'est la ${'ABCD'[ans]}, mais je ne suis pas complètement sûr.`;
    G.help=`<div class="owlsay"><span class="e mg-pico" aria-hidden="true">${K.pico('mia')}</span><span>${txt}</span></div>`;say(txt);setTimeout(()=>K.picoMood('wave'),50);
  }else{
    let base=lv===1?R(55,80):lv===2?R(40,65):R(30,55);if(alive.length===2)base=Math.min(90,base+15);
    const pct=[0,0,0,0];pct[c]=base;let rest=100-base;const others=alive.filter(x=>x!==c);
    others.forEach((x,j)=>{const v=j===others.length-1?rest:R(0,rest);pct[x]=v;rest-=v});
    G.help=`<div class="vote" role="img" aria-label="Vote de la classe">${pct.map((p,x)=>`<div class="vbar"><span>${p}%</span><i style="--h:${Math.max(p,2)}%"></i><b>${'ABCD'[x]}</b></div>`).join('')}</div>`;
    say('Voici ce que pense la classe !');
  }
  controls();
}
function validate(){
  if(G.lock||G.sel<0)return;G.lock=true;hush();
  const t=G.tok,b=$(`.ans[data-k="${G.sel}"]`,root);b.classList.add('wait');
  $$('.ans,.joker,#mok,#mkeep',root).forEach(x=>x.disabled=true);
  [0,1,2].forEach(k=>tone(392+k*60,.18,'sine',.08,k*.45));
  setTimeout(()=>{if(t!==G?.tok)return;reveal(b)},1500);
}
function reveal(b){
  const q=G.q,c=q.correct,good=$(`.ans[data-k="${c}"]`,root);b.classList.remove('wait');
  const z=$('#mzone',root);const ex=q.explain?`<p>${q.explain}</p>`:'';
  if(G.sel===c){
    b.classList.add('good');sfx.win();K.picoMood('happy');coinRain(16);const r=b.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,70);
    G.i++;
    if(G.i===15){setTimeout(()=>finish(LADDER[14],'win'),1400);return}
    const won=LADDER[G.i-1],palier=SAFE.includes(G.i-1);const praise=pick(['Bravo !','Bonne réponse !','Super !','Exact !','Génial !']);
    z.innerHTML=`<div class="fb"><h3>${praise}</h3>${ex}<p>Tu as <b>${fmt(won)}</b> pièces d'or.${palier?' C\'est un palier : elles sont à toi pour de bon !':''}</p><button class="m-btn gold" id="mnext">Question suivante ➜</button></div>`;
    say(praise+(q.explain?' '+clean(q.explain):'')+(palier?' Tu as atteint un palier !':''));
    $('#mnext').onclick=()=>{sfx.pop();ask()};
    z.scrollIntoView({block:'nearest',behavior:'smooth'});
  }else{
    b.classList.add('bad');good.classList.add('good');sfx.oops();K.picoMood('sad');
    const won=safeWin(G.i);
    z.innerHTML=`<div class="fb no"><h3>Oh non !</h3><p>La bonne réponse était <b>${'ABCD'[c]} : ${q.answers[c]}</b>.</p>${ex}<button class="m-btn gold" id="mend">Voir mon trésor</button></div>`;
    say('Oh non ! La bonne réponse était : '+clean(q.answers[c])+'. '+(q.explain?clean(q.explain):''));
    $('#mend').onclick=()=>{sfx.pop();finish(won,'lost')};
    z.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}
function finish(amount,how){
  tok++;G=null;hush();M.total+=amount;M.best=Math.max(M.best,amount);msave();root.scrollTop=0;
  const title=how==='win'?'Tu as gagné le million !':how==='stop'?(amount?'Tu as gardé ton trésor !':'À bientôt, Mia !'):amount?'Bien joué, Mia !':"Ce n'est pas grave !";
  root.innerHTML=`<div class="mr">
    <div class="mr-hero"><div class="mm-pico">${K.pico('mia')}</div><div class="mm-coin${how==='win'?' big':''}" aria-hidden="true">★</div></div>
    <h2>${title}</h2>
    ${amount?`<p>Tu repars avec</p><div class="amount" id="mamt">0</div><p>pièces d'or</p>`:(how==='stop'?`<p>Reviens vite pour une nouvelle partie !</p>`:`<p>Tu feras mieux la prochaine fois. À chaque partie, tu apprends plein de choses !</p>`)}
    <p class="mr-total">Trésor total : <b>${fmt(M.total)}</b> pièces</p>
    <div class="mconfirm"><button class="m-btn gold big" id="magain">Rejouer</button><button class="m-btn" id="mmenu">Menu</button></div>
  </div>`;
  if(amount)countUp($('#mamt',root),amount);setTimeout(()=>K.picoMood(amount?'happy':'sad'),150);if(how==='win')coinRain(40);
  if(amount){sfx.fanfare();confetti(innerWidth/2,innerHeight/3,how==='win'?200:110);if(how==='win')setTimeout(()=>confetti(innerWidth/4,innerHeight/2,120),600)}
  say(`${title} ${amount?`Tu repars avec ${amount} pièces d'or !`:''}`);
  $('#magain').onclick=()=>{sfx.win();start()};
  $('#mmenu').onclick=()=>{sfx.pop();menu()};
}
window.MIA={open};
})();
</script>
